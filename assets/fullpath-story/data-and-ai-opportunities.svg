<title id="title">Fullpath and CRM data and AI opportunities</title><desc id="desc">Opportunity map showing richer CRM lead data informing Fullpath CDP, and Fullpath insight and AI informing CRM workflows. Priorities include summarization, GenAI and virtual contact assistant integration.</desc>
