<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1165" viewBox="0 0 1440 1165" role="img" aria-labelledby="title desc">
<title id="title">Connected baggage experience</title><desc id="desc">Experience model showing cameras and arches, portable handler devices and traveler photos feeding visual identification, with branded UI, white-label UI and API delivery options. Local GPU recognition where deployment requirements demand it.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fbfaf7" /><stop offset="1" stop-color="#fbfaf7" /></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8b987d" stroke-width="1.3" /></marker></defs>
<rect width="1440" height="1165" fill="url(#bg)" /><rect x="24" y="24" width="1392" height="1117" fill="none" stroke="#dedfd7" /><path d="M24 24H94" stroke="#8b987d" stroke-width="3" />
<text x="65" y="76" text-anchor="start" fill="#5e6d50" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600"><tspan x="65" dy="0">BAGSID / VP OF UX / LAWRENCE RAILEY</tspan></text>
<text x="65" y="126" text-anchor="start" fill="#34382f" font-family="Georgia, Times New Roman, serif" font-size="36" font-weight="400"><tspan x="65" dy="0">Recognize the bag. Connect the journey.</tspan></text>
<text x="65" y="167" text-anchor="start" fill="#5e6d50" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400"><tspan x="65" dy="0">B2B operations + B2C enrollment / Product experience model</tspan></text>
<rect x="65" y="208" width="420" height="180" fill="#ffffff" stroke="#dedfd7" />
<text x="87" y="245" text-anchor="start" fill="#5e6d50" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600"><tspan x="87" dy="0">AUTOMATED CAPTURE</tspan></text>
<text x="87" y="287" text-anchor="start" fill="#34382f" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="400"><tspan x="87" dy="0">Cameras + arches</tspan></text>
<text x="87" y="328" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400"><tspan x="87" dy="0">Scanning hardware and custom</tspan><tspan x="87" dy="28">arches, with branding I helped shape.</tspan></text>
<rect x="510" y="208" width="420" height="180" fill="#ffffff" stroke="#dedfd7" />
<text x="532" y="245" text-anchor="start" fill="#5e6d50" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600"><tspan x="532" dy="0">HANDLER WORKFLOWS</tspan></text>
<text x="532" y="287" text-anchor="start" fill="#34382f" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="400"><tspan x="532" dy="0">Portable devices</tspan></text>
<text x="532" y="328" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400"><tspan x="532" dy="0">Proprietary Android devices</tspan><tspan x="532" dy="28">used by baggage handlers.</tspan></text>
<rect x="955" y="208" width="420" height="180" fill="#ffffff" stroke="#dedfd7" />
<text x="977" y="245" text-anchor="start" fill="#5e6d50" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600"><tspan x="977" dy="0">TRAVELER ENROLLMENT</tspan></text>
<text x="977" y="287" text-anchor="start" fill="#34382f" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="400"><tspan x="977" dy="0">Photos of a bag</tspan></text>
<text x="977" y="328" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400"><tspan x="977" dy="0">Consumers capture multiple angles</tspan><tspan x="977" dy="28">to register their baggage.</tspan></text>
<path d="M275 389V415H1165V389M720 389V439" fill="none" stroke="#8b987d" stroke-width="1.5" marker-end="url(#arrow)" />
<rect x="65" y="445" width="1310" height="239" fill="#e8ece2" stroke="#8b987d" />
<text x="720" y="483" text-anchor="middle" fill="#5e6d50" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600"><tspan x="720" dy="0">AI RECOGNIZES THE BAG ITSELF</tspan></text>
<text x="720" y="527" text-anchor="middle" fill="#34382f" font-family="Georgia, Times New Roman, serif" font-size="27" font-weight="400"><tspan x="720" dy="0">Color / Type / Dimensions / Scratches / Stickers</tspan></text>
<text x="720" y="563" text-anchor="middle" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400"><tspan x="720" dy="0">No RFID tag or manual barcode scan required.</tspan></text>
<path d="M110 584H1330" stroke="#8b987d" />
<text x="720" y="618" text-anchor="middle" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600"><tspan x="720" dy="0">Local GPU processing where required.</tspan></text>
<text x="720" y="653" text-anchor="middle" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400"><tspan x="720" dy="0">Airline, legal, and national requirements shape recognition that stays on site.</tspan></text>
<path d="M720 685L720 718" fill="none" stroke="#8b987d" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="65" y="748" text-anchor="start" fill="#5e6d50" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600"><tspan x="65" dy="0">THREE WAYS TO USE THE PLATFORM</tspan></text>
<rect x="65" y="773" width="420" height="156" fill="#ffffff" stroke="#dedfd7" />
<text x="87" y="818" text-anchor="start" fill="#34382f" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="400"><tspan x="87" dy="0">BagsID UI</tspan></text>
<text x="87" y="860" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400"><tspan x="87" dy="0">Branded working demonstrations</tspan><tspan x="87" dy="28">and customer deployments.</tspan></text>
<rect x="510" y="773" width="420" height="156" fill="#ffffff" stroke="#dedfd7" />
<text x="532" y="818" text-anchor="start" fill="#34382f" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="400"><tspan x="532" dy="0">White-label UI</tspan></text>
<text x="532" y="860" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400"><tspan x="532" dy="0">Embed the full experience</tspan><tspan x="532" dy="28">or selected interface elements.</tspan></text>
<rect x="955" y="773" width="420" height="156" fill="#ffffff" stroke="#dedfd7" />
<text x="977" y="818" text-anchor="start" fill="#34382f" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="400"><tspan x="977" dy="0">API access</tspan></text>
<text x="977" y="860" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400"><tspan x="977" dy="0">Integrate capabilities into</tspan><tspan x="977" dy="28">customers’ native applications.</tspan></text>
<rect x="65" y="961" width="1310" height="109" fill="#ffffff" stroke="#8b987d" />
<text x="89" y="998" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600"><tspan x="89" dy="0">DESIGNED FOR THE FULL JOURNEY</tspan></text>
<text x="89" y="1035" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400"><tspan x="89" dy="0">Desktop + laptop operations / Portable handling / Traveler enrollment / TSA recognition + diversion</tspan></text>
<text x="65" y="1123" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="65" dy="0">Software, scanning equipment, and customer integrations designed as a connected experience.</tspan></text>
</svg>