<text x="84" y="325" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="84" dy="0">Logo, colors, identity</tspan><tspan x="84" dy="27">Marketing materials</tspan></text>
