<text x="720" y="491" text-anchor="middle" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="720" dy="0">Field feedback informs the next iteration</tspan></text>
<rect x="65" y="539" width="632" height="190" fill="#ffffff" stroke="#dedfd7" />
<text x="90" y="576" text-anchor="start" fill="#5e6d50" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600"><tspan x="90" dy="0">BEFORE AI CODING TOOLS</tspan></text>
<text x="90" y="621" text-anchor="start" fill="#34382f" font-family="Georgia, Times New Roman, serif" font-size="27" font-weight="400"><tspan x="90" dy="0">Designed and coded by hand.</tspan></text>
<text x="90" y="662" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400"><tspan x="90" dy="0">I created the brand, design system, coded React/MUI</tspan><tspan x="90" dy="30">components, and first baggage-scanning UIs myself.</tspan></text>
<rect x="742" y="539" width="632" height="190" fill="#ffffff" stroke="#dedfd7" />
<text x="767" y="576" text-anchor="start" fill="#5e6d50" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600"><tspan x="767" dy="0">TODAY</tspan></text>
<text x="767" y="621" text-anchor="start" fill="#34382f" font-family="Georgia, Times New Roman, serif" font-size="27" font-weight="400"><tspan x="767" dy="0">Accelerated with AI.</tspan></text>
<text x="767" y="662" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400"><tspan x="767" dy="0">We use AI in front-end workflows to generate and</tspan><tspan x="767" dy="30">iterate on UIs faster, building on that expertise.</tspan></text>
<text x="65" y="788" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400"><tspan x="65" dy="0">I lead developers and designers, and continue tackling the hardest problems directly.</tspan></text>
<text x="65" y="827" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="65" dy="0">Brand, research, UI, code, and working demonstrations connected through one practice.</tspan></text>
