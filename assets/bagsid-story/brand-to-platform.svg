<text x="1144" y="287" text-anchor="start" fill="#34382f" font-family="Georgia, Times New Roman, serif" font-size="29" font-weight="400"><tspan x="1144" dy="0">Extend</tspan></text>
<text x="1144" y="325" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="1144" dy="0">Branded + white-label UI</tspan><tspan x="1144" dy="27">Native integrations</tspan></text>
