<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">Leading the work</title><desc id="desc">Principal-level ownership across product direction, hands-on design and development, and AI adoption. Research-grounded exploration feeds human validation.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fbfaf7" /><stop offset="1" stop-color="#fbfaf7" /></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8b987d" stroke-width="1.3" /></marker></defs>
<rect width="1440" height="820" fill="url(#bg)" /><rect x="24" y="24" width="1392" height="772" fill="none" stroke="#dedfd7" /><path d="M24 24H94" stroke="#8b987d" stroke-width="3" />
<text x="65" y="76" text-anchor="start" fill="#5e6d50" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600"><tspan x="65" dy="0">COX AUTOMOTIVE / VINSOLUTIONS / LAWRENCE RAILEY</tspan></text>
<text x="65" y="126" text-anchor="start" fill="#34382f" font-family="Georgia, Times New Roman, serif" font-size="36" font-weight="400"><tspan x="65" dy="0">Lead the team. Take on the hard problems.</tspan></text>
<rect x="65" y="185" width="420" height="285" fill="#ffffff" stroke="#dedfd7" />
<text x="90" y="222" text-anchor="start" fill="#5e6d50" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600"><tspan x="90" dy="0">01 / DIRECTION</tspan></text>
<text x="90" y="266" text-anchor="start" fill="#34382f" font-family="Georgia, Times New Roman, serif" font-size="29" font-weight="400"><tspan x="90" dy="0">Set the course</tspan></text>
<path d="M90 297H460" stroke="#dedfd7" />
<text x="90" y="323" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="90" dy="0">CRM experience architecture</tspan></text>
<path d="M90 347H460" stroke="#dedfd7" />
<text x="90" y="373" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="90" dy="0">Designer + researcher leadership</tspan></text>
<path d="M90 397H460" stroke="#dedfd7" />
<text x="90" y="423" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="90" dy="0">Direct dealership engagement</tspan></text>
<rect x="510" y="185" width="420" height="285" fill="#ffffff" stroke="#8b987d" />
<text x="535" y="222" text-anchor="start" fill="#5e6d50" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600"><tspan x="535" dy="0">02 / CRAFT</tspan></text>
<text x="535" y="266" text-anchor="start" fill="#34382f" font-family="Georgia, Times New Roman, serif" font-size="29" font-weight="400"><tspan x="535" dy="0">Do the work</tspan></text>
<path d="M535 297H905" stroke="#dedfd7" />
<text x="535" y="323" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="535" dy="0">Personally tackle thorny workflows</tspan></text>
<path d="M535 347H905" stroke="#dedfd7" />
<text x="535" y="373" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="535" dy="0">Design and code prototypes</tspan></text>
<path d="M535 397H905" stroke="#dedfd7" />
<text x="535" y="423" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="535" dy="0">Contribute front-end development</tspan></text>
<rect x="955" y="185" width="420" height="285" fill="#ffffff" stroke="#dedfd7" />
<text x="980" y="222" text-anchor="start" fill="#5e6d50" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600"><tspan x="980" dy="0">03 / CAPABILITY</tspan></text>
<text x="980" y="266" text-anchor="start" fill="#34382f" font-family="Georgia, Times New Roman, serif" font-size="29" font-weight="400"><tspan x="980" dy="0">Enable the team</tspan></text>
<path d="M980 297H1350" stroke="#dedfd7" />
<text x="980" y="323" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="980" dy="0">Coach Claude Code + Figma Make</tspan></text>
<path d="M980 347H1350" stroke="#dedfd7" />
<text x="980" y="373" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="980" dy="0">Create skills + Markdown guidance</tspan></text>
<path d="M980 397H1350" stroke="#dedfd7" />
<text x="980" y="423" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="980" dy="0">Connect the design system via MCP</tspan></text>
<text x="65" y="529" text-anchor="start" fill="#5e6d50" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600"><tspan x="65" dy="0">AI-ASSISTED ITERATION, GROUNDED IN RESEARCH</tspan></text>
<text x="65" y="581" text-anchor="start" fill="#34382f" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="400"><tspan x="65" dy="0">Research evidence</tspan></text>
<text x="65" y="618" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400"><tspan x="65" dy="0">Synthesize what we learned</tspan></text>
<path d="M455 586L491 586" fill="none" stroke="#8b987d" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="510" y="581" text-anchor="start" fill="#34382f" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="400"><tspan x="510" dy="0">Explore + challenge</tspan></text>
<text x="510" y="618" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400"><tspan x="510" dy="0">Prototypes, heuristics,</tspan><tspan x="510" dy="30">digital twins + synthetic users</tspan></text>
<path d="M900 586L936 586" fill="none" stroke="#8b987d" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="955" y="581" text-anchor="start" fill="#34382f" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="400"><tspan x="955" dy="0">Human validation</tspan></text>
<text x="955" y="618" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400"><tspan x="955" dy="0">Test with real dealership users</tspan></text>
<text x="65" y="724" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400"><tspan x="65" dy="0">AI accelerated early exploration. Real user feedback remained essential.</tspan></text>
<text x="65" y="766" text-anchor="start" fill="#34382f" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="65" dy="0">AI workflows and design-system connections operated within Cox Automotive security requirements.</tspan></text>
