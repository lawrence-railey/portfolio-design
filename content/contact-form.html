<form class="contact-form" action="api/contact.php" method="post" data-mailer aria-label="Send Lawrence a message">
  <div class="contact-fields">
    <div class="contact-field"><label for="contact-name">Name</label><input id="contact-name" name="name" required maxlength="100" autocomplete="name" aria-describedby="contact-name-error"><p class="contact-field-error" id="contact-name-error"></p></div>
    <div class="contact-field"><label for="contact-email">Email</label><input id="contact-email" name="email" required type="email" maxlength="254" autocomplete="email" aria-describedby="contact-email-error"><p class="contact-field-error" id="contact-email-error"></p></div>
  </div>
  <div class="contact-field"><label for="contact-message">Message</label><textarea id="contact-message" name="message" required maxlength="5000" rows="3" aria-describedby="contact-message-error"></textarea><p class="contact-field-error" id="contact-message-error"></p></div>
  <div class="contact-trap" aria-hidden="true"><label for="contact-website">Leave this field empty</label><input id="contact-website" name="website" autocomplete="off" tabindex="-1"></div>
  <div class="contact-actions">
    <div class="contact-secondary-actions"><a class="button button-secondary" href="__LINKEDIN__" target="_blank" rel="noopener noreferrer">Connect on LinkedIn <span aria-hidden="true">↗</span></a><a class="button button-secondary" href="assets/resume/Lawrence-Railey-Resume.pdf" download>Download my résumé <span aria-hidden="true">↓</span></a></div>
    <button class="button contact-submit" type="submit" disabled><span class="contact-submit-label">Send message</span><span aria-hidden="true">→</span></button>
  </div>
  <div class="contact-status" id="contact-status" role="status" aria-live="polite" aria-atomic="true" tabindex="-1" hidden><span class="contact-status-icon" aria-hidden="true"></span><div><p class="contact-status-text"></p><a class="contact-direct-link" href="mailto:lawrence@lawrencerailey.com" hidden>Email lawrence@lawrencerailey.com</a></div></div>
  <noscript><p class="contact-noscript">To send a message, please <a href="mailto:lawrence@lawrencerailey.com">email lawrence@lawrencerailey.com</a>.</p></noscript>
</form>
